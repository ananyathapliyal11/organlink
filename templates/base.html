<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}OrganLink{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #8b1e2d;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .navbar .nav-link {
            color: white !important;
            margin: 0 3px;
        }

        .navbar .nav-link:hover {
            color: #ffd6dc !important;
        }

        .main-content {
            min-height: 75vh;
        }

        footer {
            color: #777;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="/">OrganLink</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/recipients">
                            Recipients
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/requests">
                            Requests
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/waitlist">
                            Waitlist
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/requests/reports">
                            Request Reports
                        </a>
                    </li>

                </ul>

                <span class="text-white small">
                    Blood and Organ Donor Management System
                </span>

            </div>
        </div>
    </nav>

    <!-- Main page content -->
    <main class="container main-content py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        OrganLink | Donor Management and Traceability System
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
